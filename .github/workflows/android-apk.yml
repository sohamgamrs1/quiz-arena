name: Android APK

# Builds an installable APK on every push to main, and attaches it to a GitHub
# Release when you push a tag like v1.0.0.
#
# The two EXPO_PUBLIC_* values are inlined into the JavaScript bundle at build
# time, so they have to exist before Gradle runs. Add them under
# Settings → Secrets and variables → Actions as repository secrets:
#   EXPO_PUBLIC_SUPABASE_URL
#   EXPO_PUBLIC_SUPABASE_ANON_KEY
# Only the anon key belongs there. Never a service-role key.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: build release apk
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Secrets are passed through env: rather than interpolated into the script, so
      # a value can never be read as shell syntax.
      - name: Write environment
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::warning::EXPO_PUBLIC_SUPABASE_URL is not set — the APK will open on the setup screen."
          fi
          {
            printf 'EXPO_PUBLIC_SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'EXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"
            # mock mode is __DEV__-only, so it is deliberately never enabled here
            printf 'EXPO_PUBLIC_MOCK=0\n'
          } > .env

      - name: Generate the native project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the artifact
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          NAME="quiz-arena-${VERSION}-${GITHUB_RUN_NUMBER}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "path=$NAME" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$NAME" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiz-arena-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true

      - name: Summary
        run: |
          {
            echo "### APK built"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| file | \`${{ steps.apk.outputs.path }}\` |"
            echo "| size | ${{ steps.apk.outputs.size }} |"
            echo "| signed with | the debug keystore (sideload only, not Play Store) |"
            echo ""
            echo "Download it from the **Artifacts** section of this run."
          } >> "$GITHUB_STEP_SUMMARY"
